[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "healthbrowse-model-lab"
version = "0.1.0"
description = "Isolated research training and evaluation for a HealthBrowse medical adapter"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi==0.119.0", "uvicorn==0.37.0", "pydantic>=2.11,<3"]

[project.optional-dependencies]
train = ["torch==2.8.0", "transformers==4.57.6", "accelerate==1.10.1", "peft==0.17.1", "bitsandbytes==0.48.1", "sentencepiece==0.2.1"]
test = ["httpx==0.28.1"]

[project.scripts]
hb-model = "hb_model_lab.cli:main"

[tool.setuptools.packages.find]
include = ["hb_model_lab*"]
