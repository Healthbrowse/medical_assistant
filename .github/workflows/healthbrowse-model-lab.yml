name: Separate HealthBrowse model lab
on:
  push:
    branches: [research/healthbrowse-medical-model]
    paths: ['healthbrowse_model_lab/**', '.github/workflows/healthbrowse-model-lab.yml']
  pull_request:
    paths: ['healthbrowse_model_lab/**', '.github/workflows/healthbrowse-model-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: healthbrowse_model_lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests -v
      - run: hb-model validate --train data/examples/train.jsonl --validation data/examples/validation.jsonl --examples
      - run: hb-model preflight
# No training on GitHub-hosted CPU runners. No production deployment or secrets.
