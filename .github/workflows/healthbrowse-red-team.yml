name: HealthBrowse red-team regression
on:
  pull_request:
    paths: ['healthbrowse/**', '.github/workflows/healthbrowse-red-team.yml']
  push:
    branches: [main]
    paths: ['healthbrowse/**', '.github/workflows/healthbrowse-red-team.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: healthbrowse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: healthbrowse/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run qa:red-team
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: healthbrowse-red-team-report
          path: healthbrowse/qa-results/red-team/
          retention-days: 14
